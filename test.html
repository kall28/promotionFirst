<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Dropdown</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Container for the custom dropdown */
    .custom-dropdown {
      position: relative;
      display: inline-block;
      width: 300px;
    }

    /* Button that shows the selected option */
    .dropdown-btn {
      background-color: #007bff;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      width: 100%;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-btn:focus {
      outline: none;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.75);
    }

    /* Dropdown options container */
    .dropdown-options {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      z-index: 100;
      display: none; /* Initially hidden */
    }

    /* Individual option */
    .dropdown-option {
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .dropdown-option:hover {
      background-color: #f1f1f1;
    }

    .dropdown-option.active {
      background-color: #007bff;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <div class="custom-dropdown">
      <!-- Button to display selected option -->
      <button class="dropdown-btn" type="button">
        Select Category <span>&#9662;</span>
      </button>
      <!-- Dropdown options -->
      <div class="dropdown-options">
        <div class="dropdown-option" data-value="movies">Movies</div>
        <div class="dropdown-option" data-value="music">Music</div>
        <div class="dropdown-option" data-value="sports">Sports</div>
      </div>
    </div>
    <!-- Output selected value -->
    <p class="mt-3">Selected: <span id="selected-value">None</span></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dropdownBtn = document.querySelector(".dropdown-btn");
      const dropdownOptions = document.querySelector(".dropdown-options");
      const options = document.querySelectorAll(".dropdown-option");
      const selectedValue = document.getElementById("selected-value");

      // Toggle dropdown visibility
      dropdownBtn.addEventListener("click", () => {
        dropdownOptions.style.display =
          dropdownOptions.style.display === "block" ? "none" : "block";
      });

      // Handle option selection
      options.forEach((option) => {
        option.addEventListener("click", function () {
          // Update the button text
          dropdownBtn.innerHTML = `${this.innerText} <span>&#9662;</span>`;

          // Update selected value
          selectedValue.innerText = this.dataset.value;

          // Mark the selected option
          options.forEach((opt) => opt.classList.remove("active"));
          this.classList.add("active");

          // Close the dropdown
          dropdownOptions.style.display = "none";
        });
      });

      // Close dropdown if clicking outside
      document.addEventListener("click", function (event) {
        if (!dropdownBtn.contains(event.target) && !dropdownOptions.contains(event.target)) {
          dropdownOptions.style.display = "none";
        }
      });
    });
  </script>
</body>

</html>
