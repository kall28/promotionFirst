<script language="javascript" type="text/javascript">
    //--------------------------------------------------------
    var urlMOV = "./";
    var seatSelected = 0;
    var previousSelect = new Array();
    var Counter;
    var isEmpty = false;

    function ToggleSeats(cellId) {
        var arrSelVal;
        var arrHdnVal;
        var $arrChk;
        var hdnId;

        if ($('#chk_' + cellId).is(":checked")) {
            $('#chk_' + cellId).prop("checked", false);
            $('#td_' + cellId).removeClass("selected");
            arrSelVal = $('#hdn_' + cellId).val().split('$');

            if (arrSelVal.length > 2 && arrSelVal[2].split('^')[0] == 'G') {
                $.each($("input[type='hidden']"), function (index) {
                    arrHdnVal = $(this).val().split('$');
                    if (arrHdnVal.length > 2 && arrHdnVal[2] == arrSelVal[2]) {
                        hdnId = $(this).attr("id");
                        $("#" + hdnId.replace('hdn', 'chk')).prop("checked", false);
                        $("#" + hdnId.replace('hdn', 'td')).removeClass("selected");
                    }
                });
            }
        }
        else {

            $arrChk = $('input[type="checkbox"]');
            if ($arrChk.filter(':checked').length < 10) {
                arrSelVal = $('#hdn_' + cellId).val().split('$');

                if (arrSelVal.length > 2 && arrSelVal[2].split('^')[0] == 'G') {
                    if ($arrChk.filter(':checked').length < 9) {
                        $.each($("input[type='hidden']"), function (index) {
                            arrHdnVal = $(this).val().split('$');
                            if (arrHdnVal.length > 2 && arrHdnVal[2] == arrSelVal[2]) {
                                hdnId = $(this).attr("id");
                                $("#" + hdnId.replace('hdn', 'chk')).prop("checked", true);
                                $("#" + hdnId.replace('hdn', 'td')).addClass("selected");
                            }
                        });
                    }
                    else {
                        alert('Please select maximum 10 seats.');
                        return;
                    }
                }


            }
            else {
                alert('Please select maximum 10 seats.');
                return;
            }

            $('#chk_' + cellId).prop("checked", true);
            $('#td_' + cellId).addClass("selected");
        }

        GetSeatLayoutData();
    }

    function GetSeatLayoutData() {
        var NoOfSeats = 0;
        var strGrpDet = "";
        var arrSeatValue;

        seatLayoutData.Seats = "";
        seatLayoutData.TotalAmount = 0;

        $.each(seatLayoutData.SeatClassList, function (index, sClass) {
            sClass.SeatsValue = "";
            sClass.Seats = "";
            sClass.Qty = 0;
            sClass.NoOfSeats = 0;
            sClass.TotalAmt = 0;
        });

        $.each($('input[type="checkbox"]:checked'), function () {
            NoOfSeats = NoOfSeats + 1;
            var chkId = $(this).attr("id");

            $.each(seatLayoutData.SeatClassList, function (index, sClass) {
                arrSeatValue = $("#" + chkId.replace('chk', 'hdn')).val().split('$');
                if (arrSeatValue.length > 2 && arrSeatValue[2].split('^')[0] == 'G') {
                    strGrpDet = arrSeatValue[2].split('^');
                    if (sClass.AreaCode == strGrpDet[1].split('|')[0]) {
                        sClass.AdditionalField1 = 'G';
                        if (sClass.SeatsValue === "") { sClass.SeatsValue = arrSeatValue[1]; }
                        else { sClass.SeatsValue += ", " + arrSeatValue[1]; }

                        if (sClass.Seats === "") { sClass.Seats = arrSeatValue[0]; }
                        else { sClass.Seats += ", " + arrSeatValue[0]; }

                        if (seatLayoutData.Seats === "") { seatLayoutData.Seats += arrSeatValue[0].replace('-', ''); }
                        else { seatLayoutData.Seats += ", " + arrSeatValue[0].replace('-', ''); }

                        sClass.Qty++;
                        sClass.NoOfSeats++;
                    }
                }
                else {
                    if (sClass.AreaCode == $("#" + chkId.replace('chk', 'hdn')).val().split('$')[1].split('|')[0]) {
                        arrSeatValue = $("#" + chkId.replace('chk', 'hdn')).val().split('$');

                        if (sClass.SeatsValue === "") { sClass.SeatsValue = arrSeatValue[1]; }
                        else { sClass.SeatsValue += ", " + arrSeatValue[1]; }

                        if (sClass.Seats === "") { sClass.Seats = arrSeatValue[0]; }
                        else { sClass.Seats += ", " + arrSeatValue[0]; }

                        if (seatLayoutData.Seats === "") { seatLayoutData.Seats += arrSeatValue[0].replace('-', ''); }
                        else { seatLayoutData.Seats += ", " + arrSeatValue[0].replace('-', ''); }

                        sClass.Qty++;
                        sClass.NoOfSeats++;
                    }
                }
            });

        });

        $.each(seatLayoutData.SeatClassList, function (index, sClass) {
            if (sClass.AdditionalField1 === 'G') {
                sClass.Qty = sClass.NoOfSeats / 2;//sClass.GroupQty;
                sClass.TotalAmt = (sClass.Price * sClass.Qty) + (sClass.BookingFee * sClass.NoOfSeats);
                seatLayoutData.TotalAmount += sClass.TotalAmt;
            }
            else {
                sClass.TotalAmt = (sClass.Price + sClass.BookingFee) * sClass.Qty;
                seatLayoutData.TotalAmount += sClass.TotalAmt;
            }
        });

        try {
            console.log(seatLayoutData);
            var strSeatsData = JSON.stringify(seatLayoutData);
            device.getSeatData(strSeatsData);
            return false;
        } catch (err) {
            console.log('The native context does not exist yet');
        }
    }
</script>
