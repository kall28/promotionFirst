<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Number Calendar</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    .week-number {
      background-color: #f0f8ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Week Number Calendar</h1>
  <div id="calendar"></div>

  <script>
    function generateCalendar(year) {
      const calendarDiv = document.getElementById('calendar');
      const months = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
      ];
      const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      months.forEach((month, monthIndex) => {
        const table = document.createElement('table');
        const caption = document.createElement('caption');
        caption.textContent = `${month} ${year}`;
        table.appendChild(caption);

        // Header Row
        const headerRow = document.createElement('tr');
        headerRow.innerHTML = `<th class="week-number">Wk</th>` +
          days.map(day => `<th>${day}</th>`).join('');
        table.appendChild(headerRow);

        const firstDay = new Date(year, monthIndex, 1);
        const lastDay = new Date(year, monthIndex + 1, 0);

        let weekRow = document.createElement('tr');
        weekRow.innerHTML = `<td class="week-number">${getWeekNumber(firstDay)}</td>`;
        for (let i = 0; i < firstDay.getDay(); i++) {
          weekRow.innerHTML += `<td></td>`;
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
          const currentDate = new Date(year, monthIndex, day);
          if (currentDate.getDay() === 0 && day !== 1) {
            table.appendChild(weekRow);
            weekRow = document.createElement('tr');
            weekRow.innerHTML = `<td class="week-number">${getWeekNumber(currentDate)}</td>`;
          }
          weekRow.innerHTML += `<td>${day}</td>`;
        }

        // Fill last row
        while (weekRow.children.length < 8) {
          weekRow.innerHTML += `<td></td>`;
        }
        table.appendChild(weekRow);

        calendarDiv.appendChild(table);
      });
    }

    function getWeekNumber(date) {
      const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
      const pastDaysOfYear = (date - firstDayOfYear + 86400000) / 86400000;
      return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
    }

    generateCalendar(new Date().getFullYear());
  </script>
</body>
</html>
